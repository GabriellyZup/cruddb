spring:
  datasource:
    url: jdbc:postgresql://${BD_HOST:localhost} :${/DB_PORT:5432} /$ {DB_Name:escola}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-call-name: org.postgresql.Driver

jpa:
  hibernate:
    ddl-auto: update
  show-sql: true
  properties:
    hibernate:
      format_sql: true


